services:
  spark-master:
    image: annatr/apache-spark:3.5.7-java11-python3.13
    container_name: spark-master
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
       - ./apps:/opt/spark-apps
       - ./data:/opt/spark-data
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master
    networks:
      - hadoop_net

  spark-worker-a:
    image: annatr/apache-spark:3.5.7-java11-python3.13
    container_name: spark-worker-a
    ports:
      - "9091:8080"
      - "7000:7000"
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-a
    volumes:
       - ./apps:/opt/spark-apps
       - ./data:/opt/spark-data
    networks:
      - hadoop_net

  spark-worker-b:
    image: annatr/apache-spark:3.5.7-java11-python3.13
    container_name: spark-worker-b
    ports:
      - "9092:8080"
      - "7001:7000"
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-b
    volumes:
        - ./apps:/opt/spark-apps
        - ./data:/opt/spark-data
    networks:
      - hadoop_net

  # --- AIRFLOW ---
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    volumes:
      # Keeps the SQLite metadata DB (DAG run history) and task logs across rebuilds
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/scripts
      - ./data:/opt/spark-data
      - ./apps:/opt/spark-apps
      # Google Cloud credentials (gcp/credentials.json, not committed)
      - ./gcp:/opt/gcp:ro
    ports:
      - "8085:8080" # Airflow UI
    environment:
      - LOAD_EX=n
      # Spark configuration
      # SparkSubmitOperator reads the master from the spark_default connection (falls back to yarn)
      - 'AIRFLOW_CONN_SPARK_DEFAULT={"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      - PYSPARK_PYTHON=python3.13
      # Google Cloud (kmeans_gcp_dag.py); values come from the .env file next to this file
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-europe-west1}
      - GCP_BUCKET=${GCP_BUCKET:-}
      # Read by google-auth; works with a service account key or a gcloud ADC file
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp/credentials.json
      # Default project for google-auth; a gcloud ADC file has none, which only logs a warning
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID:-}
      # Empty connection = use GOOGLE_APPLICATION_CREDENTIALS
      - 'AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT={"conn_type": "google_cloud_platform"}'
    depends_on:
      - spark-master
    command: standalone
    networks:
      - hadoop_net


volumes:
  airflow_home:

networks:
  hadoop_net:
    name: hadoop_net
    external: true

